name: Terraform Validation

on:
  # Manual trigger is useful when iterating on the workflow itself.
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-fmt:
    name: Terraform Fmt Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Check Terraform formatting
        # Run one repo-wide formatting check because fmt is not tied
        # to a specific Terraform root.
        run: terraform fmt -check -recursive

  terraform-validate-and-lint:
    name: Validate ${{ matrix.directory }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        directory:
          # Explicit matrix keeps CI focused on real Terraform roots
          # that are currently implemented in this repository.
          - bootstrap/dev
          - envs/dev
          - modules/network
          - modules/nat_gateway
          - modules/vpc_gateway_endpoints
          - modules/vpc_interface_endpoints
          - modules/kms_keys
          - modules/s3_bucket
          - modules/logging_baseline
          - modules/vpc_flow_logs
          - modules/route53_private_zones
          - modules/ecs_cluster
          - modules/alb_ingress
          - modules/ecs_fargate_service
          - modules/remote_backend

    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.directory }}

    env:
      # Authenticated plugin init avoids GitHub API/rate-limit issues
      # when many matrix jobs initialize TFLint in parallel.
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.60.0
          tflint_wrapper: false

      - name: Show Terraform version
        run: terraform version

      - name: Show TFLint version
        run: tflint --version

      - name: Terraform init (backend disabled)
        # CI validates code structure only. Using -backend=false keeps
        # validation detached from real remote state and AWS access.
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        # TFLint runs per Terraform root after init so provider/module
        # context is already available for static analysis.
        run: tflint
