<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
  <title id="title">tf-template-stack runtime topology for envs/dev</title>
  <desc id="desc">Topology view of the validated dev environment showing placement of networking, platform services, and workload components.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f4; }
      .panel { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 18; ry: 18; }
      .group { fill: #fefcf7; stroke: #374151; stroke-width: 2; rx: 16; ry: 16; }
      .box { fill: #fffdf8; stroke: #4b5563; stroke-width: 2; rx: 12; ry: 12; }
      .blue { fill: #eef4fb; stroke: #2c5f8a; stroke-width: 2; rx: 12; ry: 12; }
      .green { fill: #e8f1e8; stroke: #2f6b3b; stroke-width: 2; rx: 12; ry: 12; }
      .amber { fill: #f8efe2; stroke: #9a5b16; stroke-width: 2; rx: 12; ry: 12; }
      .title { font: 700 28px 'Segoe UI', sans-serif; fill: #111827; }
      .subtitle { font: 600 18px 'Segoe UI', sans-serif; fill: #1f2937; }
      .label { font: 600 16px 'Segoe UI', sans-serif; fill: #111827; }
      .small { font: 500 14px 'Segoe UI', sans-serif; fill: #374151; }
      .tiny { font: 500 13px 'Segoe UI', sans-serif; fill: #4b5563; }
      .line { stroke: #4b5563; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="980"/>
  <text class="title" x="60" y="58">Runtime Topology (`envs/dev`)</text>
  <text class="small" x="60" y="88">Placement-oriented view of the validated AWS infrastructure for the dev environment.</text>

  <rect class="panel" x="60" y="130" width="1160" height="790"/>
  <text class="subtitle" x="90" y="168">AWS account / eu-central-1</text>

  <rect class="group" x="90" y="210" width="760" height="650"/>
  <text class="label" x="115" y="246">VPC</text>

  <rect class="group" x="120" y="290" width="300" height="190"/>
  <text class="label" x="145" y="325">Public subnets</text>
  <rect class="amber" x="145" y="350" width="250" height="50"/>
  <text class="label" x="172" y="381">Internal ALB</text>
  <rect class="amber" x="145" y="415" width="250" height="50"/>
  <text class="label" x="172" y="446">NAT Gateway</text>

  <rect class="group" x="455" y="290" width="365" height="260"/>
  <text class="label" x="480" y="325">Private subnets</text>
  <rect class="green" x="480" y="350" width="315" height="58"/>
  <text class="label" x="515" y="383">ECS cluster + ECS service</text>
  <rect class="blue" x="480" y="425" width="315" height="50"/>
  <text class="label" x="515" y="456">CloudWatch Logs interface endpoint</text>
  <rect class="box" x="480" y="490" width="145" height="50"/>
  <text class="label" x="510" y="521">S3 endpoint</text>
  <rect class="box" x="650" y="490" width="145" height="50"/>
  <text class="label" x="665" y="521">DynamoDB endpoint</text>

  <rect class="box" x="120" y="520" width="300" height="65"/>
  <text class="label" x="145" y="555">Internet Gateway</text>
  <text class="tiny" x="145" y="576">public internet boundary</text>

  <rect class="green" x="120" y="635" width="300" height="120"/>
  <text class="label" x="145" y="670">Route53 private hosted zone</text>
  <text class="tiny" x="145" y="692">internal DNS namespace</text>
  <text class="tiny" x="145" y="713">for private environment resources</text>

  <rect class="group" x="890" y="210" width="300" height="650"/>
  <text class="label" x="915" y="246">Shared platform services</text>

  <rect class="blue" x="915" y="290" width="250" height="54"/>
  <text class="label" x="960" y="322">KMS keys</text>

  <rect class="blue" x="915" y="365" width="250" height="54"/>
  <text class="label" x="948" y="397">CloudWatch log groups</text>

  <rect class="blue" x="915" y="440" width="250" height="54"/>
  <text class="label" x="955" y="472">VPC Flow Logs</text>

  <rect class="blue" x="915" y="535" width="250" height="54"/>
  <text class="label" x="960" y="567">S3 logs bucket</text>

  <rect class="blue" x="915" y="610" width="250" height="54"/>
  <text class="label" x="967" y="642">S3 app bucket</text>

  <path class="line" marker-end="url(#arrow)" d="M395 375 L480 375"/>
  <path class="line" marker-end="url(#arrow)" d="M395 440 L480 379"/>
  <path class="line" marker-end="url(#arrow)" d="M420 552 L480 515"/>
  <path class="line" marker-end="url(#arrow)" d="M820 380 L915 392"/>
  <path class="line" marker-end="url(#arrow)" d="M1040 494 L1040 535"/>

  <text class="tiny" x="90" y="895">Topology focus: what exists, where it is placed, and which components belong to the network, workload, and shared-services layers.</text>
</svg>
