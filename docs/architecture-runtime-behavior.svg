<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">tf-template-stack runtime behavior and validation flows</title>
  <desc id="desc">Behavior view of the validated dev environment showing request, endpoint, and validation flows.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f4; }
      .panel { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 18; ry: 18; }
      .box { fill: #fffdf8; stroke: #4b5563; stroke-width: 2; rx: 12; ry: 12; }
      .blue { fill: #eef4fb; stroke: #2c5f8a; stroke-width: 2; rx: 12; ry: 12; }
      .green { fill: #e8f1e8; stroke: #2f6b3b; stroke-width: 2; rx: 12; ry: 12; }
      .amber { fill: #f8efe2; stroke: #9a5b16; stroke-width: 2; rx: 12; ry: 12; }
      .title { font: 700 28px 'Segoe UI', sans-serif; fill: #111827; }
      .subtitle { font: 600 18px 'Segoe UI', sans-serif; fill: #1f2937; }
      .label { font: 600 16px 'Segoe UI', sans-serif; fill: #111827; }
      .small { font: 500 14px 'Segoe UI', sans-serif; fill: #374151; }
      .tiny { font: 500 13px 'Segoe UI', sans-serif; fill: #4b5563; }
      .line { stroke: #4b5563; stroke-width: 2.5; fill: none; }
      .dash { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="900"/>
  <text class="title" x="60" y="58">Runtime Behavior / Validation Flows</text>
  <text class="small" x="60" y="88">Operational view of request path, private-runtime dependencies, and the workflow validation signals used for the dev environment.</text>

  <rect class="panel" x="60" y="130" width="1160" height="710"/>
  <text class="subtitle" x="90" y="168">Behavior and verification flow</text>

  <rect class="green" x="480" y="175" width="320" height="110"/>
  <text class="label" x="525" y="212">Workflow validation signals</text>
  <text class="tiny" x="525" y="237">ECS service stability wait</text>
  <text class="tiny" x="525" y="258">ALB target-group health verification</text>

  <rect class="amber" x="190" y="390" width="200" height="70"/>
  <text class="label" x="222" y="429">Internal ALB</text>

  <rect class="amber" x="490" y="390" width="200" height="70"/>
  <text class="label" x="526" y="429">Target group</text>

  <rect class="green" x="790" y="390" width="230" height="70"/>
  <text class="label" x="840" y="429">ECS service</text>

  <rect class="box" x="210" y="610" width="210" height="70"/>
  <text class="label" x="256" y="649">NAT Gateway</text>

  <rect class="box" x="500" y="610" width="210" height="70"/>
  <text class="label" x="536" y="649">Gateway endpoints</text>
  <text class="tiny" x="536" y="668">S3 + DynamoDB</text>

  <rect class="box" x="790" y="610" width="230" height="70"/>
  <text class="label" x="812" y="649">Logs interface endpoint</text>

  <path class="line" marker-end="url(#arrow)" d="M390 425 L490 425"/>
  <path class="line" marker-end="url(#arrow)" d="M690 425 L790 425"/>
  <path class="line" marker-end="url(#arrow)" d="M590 390 L620 285"/>
  <path class="line" marker-end="url(#arrow)" d="M905 390 L770 285"/>
  <path class="dash" marker-end="url(#arrow)" d="M905 460 L905 610"/>
  <path class="dash" marker-end="url(#arrow)" d="M905 460 L605 610"/>
  <path class="dash" marker-end="url(#arrow)" d="M905 460 L315 610"/>

  <text class="tiny" x="90" y="800">Behavior focus: request path, private-runtime dependencies, and the AWS-native signals used by GitHub Actions to validate a successful deployment.</text>
</svg>
