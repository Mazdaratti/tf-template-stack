<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
  <title id="title">tf-template-stack dev architecture</title>
  <desc id="desc">Compact architecture diagram for the validated dev environment and bootstrap path.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f4; }
      .panel { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 18; ry: 18; }
      .group { fill: #fefcf7; stroke: #374151; stroke-width: 2; rx: 16; ry: 16; }
      .box { fill: #fffdf8; stroke: #4b5563; stroke-width: 2; rx: 12; ry: 12; }
      .accent { fill: #e8f1e8; stroke: #2f6b3b; stroke-width: 2; rx: 12; ry: 12; }
      .data { fill: #eef4fb; stroke: #2c5f8a; stroke-width: 2; rx: 12; ry: 12; }
      .warn { fill: #f8efe2; stroke: #9a5b16; stroke-width: 2; rx: 12; ry: 12; }
      .title { font: 700 28px 'Segoe UI', sans-serif; fill: #111827; }
      .subtitle { font: 600 18px 'Segoe UI', sans-serif; fill: #1f2937; }
      .label { font: 600 16px 'Segoe UI', sans-serif; fill: #111827; }
      .small { font: 500 14px 'Segoe UI', sans-serif; fill: #374151; }
      .tiny { font: 500 13px 'Segoe UI', sans-serif; fill: #4b5563; }
      .line { stroke: #4b5563; stroke-width: 2.5; fill: none; }
      .dash { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="940"/>

  <text class="title" x="60" y="58">tf-template-stack: validated dev architecture</text>
  <text class="small" x="60" y="88">Portfolio summary view of the bootstrap path, shared platform layers, and workload path validated in AWS and GitHub Actions.</text>

  <rect class="panel" x="60" y="130" width="1160" height="190"/>
  <text class="subtitle" x="90" y="170">Bootstrap / deployment control plane</text>

  <rect class="warn" x="90" y="195" width="250" height="84"/>
  <text class="label" x="112" y="228">bootstrap/dev</text>
  <text class="tiny" x="112" y="252">Creates S3 backend bucket</text>
  <text class="tiny" x="112" y="271">Generates envs/dev/backend.tf</text>

  <rect class="data" x="390" y="195" width="250" height="84"/>
  <text class="label" x="412" y="228">GitHub OIDC + deploy role</text>
  <text class="tiny" x="412" y="252">Manually triggered deployment</text>
  <text class="tiny" x="412" y="271">AWS role assumption via OIDC</text>

  <rect class="box" x="690" y="195" width="220" height="84"/>
  <text class="label" x="712" y="228">GitHub Environment: dev</text>
  <text class="tiny" x="712" y="252">backend bucket / key</text>
  <text class="tiny" x="712" y="271">AWS role / region wiring</text>

  <rect class="accent" x="950" y="195" width="240" height="84"/>
  <text class="label" x="972" y="228">Deploy Dev Environment</text>
  <text class="tiny" x="972" y="252">Terraform init / validate / plan / apply</text>
  <text class="tiny" x="972" y="271">ECS + target-group health checks</text>

  <path class="line" marker-end="url(#arrow)" d="M340 237 L390 237"/>
  <path class="line" marker-end="url(#arrow)" d="M640 237 L690 237"/>
  <path class="line" marker-end="url(#arrow)" d="M910 237 L950 237"/>

  <rect class="panel" x="60" y="350" width="1160" height="520"/>
  <text class="subtitle" x="90" y="390">envs/dev platform and workload layers</text>

  <rect class="group" x="90" y="420" width="280" height="180"/>
  <text class="label" x="115" y="455">1. Network foundation</text>
  <rect class="box" x="115" y="475" width="230" height="46"/>
  <text class="label" x="136" y="504">VPC + public/private subnets</text>
  <rect class="box" x="115" y="535" width="230" height="46"/>
  <text class="label" x="136" y="564">Route tables + Internet Gateway</text>

  <rect class="group" x="410" y="420" width="280" height="180"/>
  <text class="label" x="435" y="455">2. Private connectivity</text>
  <rect class="box" x="435" y="475" width="230" height="46"/>
  <text class="label" x="456" y="504">Gateway endpoints</text>
  <text class="tiny" x="456" y="521">S3, DynamoDB</text>
  <rect class="box" x="435" y="535" width="230" height="46"/>
  <text class="label" x="456" y="564">Interface endpoint</text>
  <text class="tiny" x="456" y="581">CloudWatch Logs</text>

  <rect class="group" x="730" y="420" width="460" height="180"/>
  <text class="label" x="755" y="455">3. Shared platform services</text>
  <rect class="data" x="755" y="475" width="130" height="46"/>
  <text class="label" x="782" y="504">KMS keys</text>
  <rect class="data" x="905" y="475" width="130" height="46"/>
  <text class="label" x="940" y="504">S3 buckets</text>
  <rect class="data" x="1055" y="475" width="110" height="46"/>
  <text class="label" x="1070" y="504">Log groups</text>
  <rect class="data" x="755" y="535" width="200" height="46"/>
  <text class="label" x="778" y="564">VPC Flow Logs</text>
  <rect class="data" x="975" y="535" width="190" height="46"/>
  <text class="label" x="1008" y="564">Route53 private zone</text>

  <rect class="group" x="90" y="640" width="280" height="180"/>
  <text class="label" x="115" y="675">4. Compute foundation</text>
  <rect class="accent" x="115" y="700" width="230" height="52"/>
  <text class="label" x="138" y="731">ECS cluster</text>
  <text class="tiny" x="138" y="749">Fargate and Fargate Spot</text>

  <rect class="group" x="410" y="640" width="280" height="180"/>
  <text class="label" x="435" y="675">5. Shared ingress</text>
  <rect class="accent" x="435" y="700" width="230" height="52"/>
  <text class="label" x="468" y="731">Internal ALB</text>
  <text class="tiny" x="468" y="749">listener + target group + access logs</text>

  <rect class="group" x="730" y="640" width="460" height="180"/>
  <text class="label" x="755" y="675">6. Workload service layer</text>
  <rect class="accent" x="755" y="700" width="190" height="52"/>
  <text class="label" x="792" y="731">ECS service</text>
  <text class="tiny" x="792" y="749">task definition + SG</text>
  <rect class="accent" x="975" y="700" width="190" height="52"/>
  <text class="label" x="1002" y="731">CloudWatch logs</text>
  <text class="tiny" x="1002" y="749">service log group</text>

  <path class="line" marker-end="url(#arrow)" d="M370 510 L410 510"/>
  <path class="line" marker-end="url(#arrow)" d="M690 510 L730 510"/>
  <path class="line" marker-end="url(#arrow)" d="M370 726 L410 726"/>
  <path class="line" marker-end="url(#arrow)" d="M690 726 L730 726"/>
  <path class="dash" marker-end="url(#arrow)" d="M1035 521 L1035 694"/>
  <path class="dash" marker-end="url(#arrow)" d="M855 521 L855 694"/>
  <path class="dash" marker-end="url(#arrow)" d="M1110 521 L1110 694"/>
  <path class="dash" marker-end="url(#arrow)" d="M550 752 C550 805, 690 805, 755 752"/>

  <text class="tiny" x="76" y="905">Validated path: bootstrap/dev -> GitHub Environment sync -> manually triggered GitHub Actions deployment -> ECS stability + target-group health verification.</text>
</svg>
