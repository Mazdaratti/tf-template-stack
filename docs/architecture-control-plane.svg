<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">tf-template-stack control plane and delivery flow</title>
  <desc id="desc">Control plane diagram showing bootstrap, GitHub environment sync, OIDC, and the manually triggered deployment workflow.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f4; }
      .panel { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 18; ry: 18; }
      .box { fill: #fffdf8; stroke: #4b5563; stroke-width: 2; rx: 12; ry: 12; }
      .blue { fill: #eef4fb; stroke: #2c5f8a; stroke-width: 2; rx: 12; ry: 12; }
      .green { fill: #e8f1e8; stroke: #2f6b3b; stroke-width: 2; rx: 12; ry: 12; }
      .amber { fill: #f8efe2; stroke: #9a5b16; stroke-width: 2; rx: 12; ry: 12; }
      .title { font: 700 28px 'Segoe UI', sans-serif; fill: #111827; }
      .subtitle { font: 600 18px 'Segoe UI', sans-serif; fill: #1f2937; }
      .label { font: 600 16px 'Segoe UI', sans-serif; fill: #111827; }
      .small { font: 500 14px 'Segoe UI', sans-serif; fill: #374151; }
      .tiny { font: 500 13px 'Segoe UI', sans-serif; fill: #4b5563; }
      .line { stroke: #4b5563; stroke-width: 2.5; fill: none; }
      .dash { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <text class="title" x="60" y="58">Control Plane / Delivery Flow</text>
  <text class="small" x="60" y="88">How the repository is operated: local bootstrap, GitHub Environment sync, OIDC role assumption, and the manually triggered deployment workflow.</text>

  <rect class="panel" x="60" y="130" width="1160" height="570"/>
  <text class="subtitle" x="90" y="168">Repository delivery path</text>

  <rect class="amber" x="90" y="220" width="220" height="90"/>
  <text class="label" x="118" y="255">Local operator</text>
  <text class="tiny" x="118" y="279">runs bootstrap locally</text>
  <text class="tiny" x="118" y="298">syncs GitHub Environment vars</text>

  <rect class="amber" x="360" y="220" width="240" height="90"/>
  <text class="label" x="388" y="255">bootstrap/dev</text>
  <text class="tiny" x="388" y="279">creates backend bucket</text>
  <text class="tiny" x="388" y="298">creates OIDC provider + deploy role</text>

  <rect class="blue" x="660" y="180" width="230" height="74"/>
  <text class="label" x="688" y="214">S3 backend bucket</text>
  <text class="tiny" x="688" y="236">remote state for envs/dev</text>

  <rect class="blue" x="660" y="276" width="230" height="92"/>
  <text class="label" x="688" y="311">GitHub OIDC provider</text>
  <text class="tiny" x="688" y="335">IAM deploy role</text>
  <text class="tiny" x="688" y="354">repo/environment trust</text>

  <rect class="blue" x="950" y="220" width="220" height="90"/>
  <text class="label" x="978" y="255">GitHub Environment: dev</text>
  <text class="tiny" x="978" y="279">AWS role / region</text>
  <text class="tiny" x="978" y="298">backend bucket / key</text>

  <rect class="green" x="90" y="430" width="250" height="90"/>
  <text class="label" x="118" y="465">GitHub Actions workflow</text>
  <text class="tiny" x="118" y="489">Deploy Dev Environment</text>
  <text class="tiny" x="118" y="508">manually triggered</text>

  <rect class="green" x="400" y="430" width="250" height="90"/>
  <text class="label" x="428" y="465">Generated backend.tf</text>
  <text class="tiny" x="428" y="489">bucket / key / region</text>
  <text class="tiny" x="428" y="508">use_lockfile = true</text>

  <rect class="green" x="710" y="430" width="250" height="90"/>
  <text class="label" x="738" y="465">envs/dev apply path</text>
  <text class="tiny" x="738" y="489">terraform init / validate / plan / apply</text>
  <text class="tiny" x="738" y="508">runs against AWS via OIDC role</text>

  <rect class="box" x="1020" y="430" width="170" height="90"/>
  <text class="label" x="1048" y="465">Workflow checks</text>
  <text class="tiny" x="1048" y="489">ECS stable</text>
  <text class="tiny" x="1048" y="508">target group healthy</text>

  <path class="line" marker-end="url(#arrow)" d="M310 265 L360 265"/>
  <path class="line" marker-end="url(#arrow)" d="M600 220 L660 220"/>
  <path class="line" marker-end="url(#arrow)" d="M600 310 L660 320"/>
  <path class="dash" marker-end="url(#arrow)" d="M600 270 C760 270, 850 270, 950 265"/>
  <path class="line" marker-end="url(#arrow)" d="M200 310 L200 430"/>
  <path class="dash" marker-end="url(#arrow)" d="M1060 310 L1060 430"/>
  <path class="line" marker-end="url(#arrow)" d="M340 475 L400 475"/>
  <path class="line" marker-end="url(#arrow)" d="M650 475 L710 475"/>
  <path class="line" marker-end="url(#arrow)" d="M960 475 L1020 475"/>

  <text class="tiny" x="90" y="650">Control plane boundary: bootstrap is local and manual; deployment is executed in GitHub Actions through OIDC and the generated backend configuration.</text>
</svg>
